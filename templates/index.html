{% extends "base.html" %}
{% block title %}日志总览 · log-ui{% endblock %}

{% block content %}
<div class="card">
  <form id="searchform" method="get" action="/search">
    <div class="row">
      <div><label>服务器</label>
        <select name="host">
          {% for h in hosts %}<option value="{{h}}" {{ 'selected' if h==host else '' }}>{{h}}</option>{% endfor %}
        </select>
      </div>
      <div><label>等级</label>
        <select name="level">
          {% for l in levels %}<option value="{{l}}" {{ 'selected' if l==level else '' }}>{{l}}</option>{% endfor %}
        </select>
      </div>
      <div><label>LogsQL / 关键词</label>
        <input type="text" name="q" value="{{q}}" size="32" placeholder='例: _msg:"error" 或 *'>
      </div>
      <div><label>条数</label>
        <input type="number" name="limit" value="{{limit}}" min="1" max="1000" style="width:80px">
      </div>
      <div><label>自动刷新</label>
        <select id="refresh" name="refresh">
          {% for s in refresh_options %}<option value="{{s}}" {{ 'selected' if s==refresh else '' }}>{{ '关' if s==0 else s~'s' }}</option>{% endfor %}
        </select>
      </div>
      <div style="align-self:flex-end"><button>搜索</button></div>
    </div>
  </form>
  <div class="meta" style="margin-top:10px">
    查询: <code>{{expr}}</code> · <span id="rstatus">返回 {{count}} 条</span> · <span id="rtime"></span>
  </div>
</div>

<div id="logs">
  {% include "_logs.html" %}
</div>

<script src="/static/search.js"></script>
{% endblock %}
