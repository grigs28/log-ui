<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>{% block title %}log-ui{% endblock %}</title>
  <link rel="stylesheet" href="/static/log-ui.css">
</head>
<body class="theme-{{ theme or 'dark' }}">
  <header>
    <span class="title"><span class="dot"></span>log‑ui</span>
    <nav>
      <a href="/">总览</a>
      <a href="/search">日志</a>
      <a href="/servers">服务器</a>
      <a href="/tail">实时</a>
      <a href="/settings">设置</a>
    </nav>
    <span class="spacer"></span>
    {% if user %}
      <span class="user">👤 <span>{{ user.display_name or user.username }}</span>{% if user.is_admin %} · 管理{% endif %}</span>
      <a href="/auth/logout" class="btn btn-muted" style="padding:4px 10px;font-size:12px">登出</a>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
